services:
  campux:
    image: ${CAMPUX_IMAGE:?set CAMPUX_IMAGE to an immutable GHCR tag}
    container_name: campux
    restart: unless-stopped
    env_file:
      - ${CAMPUX_ENV_FILE:-/home/cuteyuchen/projects/campux-deploy/.env}
    environment:
      DATABASE_URL: ${CAMPUX_CONTAINER_DATABASE_URL:?set CAMPUX_CONTAINER_DATABASE_URL in the server environment file}
      S3_ENDPOINT: http://minio:9000
      CAMPUX_SERVER_HOST: 0.0.0.0
      CAMPUX_SERVER_PORT: 8989
      CAMPUX_WEB_DIST_DIR: /app/apps/web/dist
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium-browser
    ports:
      - "8989:8989"
    networks:
      - campux-infra
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:8989/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  campux-infra:
    external: true
    name: ${CAMPUX_DOCKER_NETWORK:-campux-deploy_default}
