name: Campux Container Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: campux-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/campux
  OCR_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/campux-ocr

jobs:
  verify:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Generate SQLite Prisma client for server tests
        run: bun run db:sqlite:generate

      - name: Test server
        run: bun test apps/server/src

      - name: Test web
        run: bun test apps/web/src

      - name: Typecheck server
        run: bun --cwd apps/server typecheck

      - name: Typecheck web
        run: bun --cwd apps/web typecheck

  build:
    name: Build and push image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Campux
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:last
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            CAMPUX_BUILD_VERSION=main-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Build and push OCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ocr/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.OCR_IMAGE_NAME }}:last
            ${{ env.OCR_IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=campux-ocr
          cache-to: type=gha,mode=max,scope=campux-ocr
          provenance: false
          sbom: false
